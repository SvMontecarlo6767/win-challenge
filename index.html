<!DOCTYPE html>
<html lang="de">
<head>

<meta property="og:title" content="WIN CHALLENGE · SV Monte Carlo">
<meta property="og:description" content="Live-Stand der WIN CHALLENGE – 14 Challenges, 7 Leute, ein Ziel. 🦌🏆">
<meta property="og:image" content="https://svmontecarlo6767.github.io/win-challenge/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">

<meta name="mobile-web-app-capable" content="yes">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#04110b;--g:#0b2a1f;--g2:#123a2b;--gold:#c9a24b;--gold2:#e7cf8a;--gold3:#fff4cf;--ink:#f4f1e6;--mut:#9fb5a9;--dim:#6f8a7d;--red:#ff6b5b;--line:rgba(201,162,75,.28);--fd:"Cinzel",Georgia,serif;--fn:"Oswald",system-ui,sans-serif}
*{box-sizing:border-box;margin:0}
html{background:var(--bg)}
body{font-family:-apple-system,system-ui,sans-serif;color:var(--ink);background:var(--bg);min-height:100vh;padding-bottom:118px;overflow-x:hidden;-webkit-tap-highlight-color:transparent}
body:before{content:"";position:fixed;inset:0;z-index:-3;background:radial-gradient(120% 70% at 50% -10%,#1d6047 0,#0b2a1f 45%,#04110b 100%)}
body:after{content:"";position:fixed;inset:0;z-index:-2;opacity:.06;background:var(--pat);background-size:130px}
.wm{position:fixed;left:50%;top:55%;width:150vmin;max-width:none;transform:translate(-50%,-50%);opacity:.05;filter:blur(1px) grayscale(.3);z-index:-1;pointer-events:none;animation:wm 60s linear infinite}
@keyframes wm{to{transform:translate(-50%,-50%) rotate(360deg)}}

header{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top));background:rgba(4,17,11,.78);-webkit-backdrop-filter:blur(14px) saturate(1.4);backdrop-filter:blur(14px) saturate(1.4);border-bottom:1px solid var(--line)}
.hl{width:44px;height:44px;perspective:300px;flex:none}
.hl img{width:100%;height:100%;border-radius:50%;box-shadow:0 0 0 2px var(--gold),0 4px 14px rgba(0,0,0,.6);animation:hl 7s ease-in-out infinite}
@keyframes hl{0%,70%{transform:rotateY(0)}85%,100%{transform:rotateY(360deg)}}
.ht{flex:1;min-width:0}
.ht b{display:block;font:900 15px/1.15 var(--fd);letter-spacing:.1em;background:linear-gradient(180deg,#fff7d6,#e7cf8a 50%,#b08a35);-webkit-background-clip:text;background-clip:text;color:transparent}
#st,#ls{font-size:11px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sv,.snd{border:1px solid var(--line);background:rgba(201,162,75,.12);color:var(--gold2);font-weight:700;border-radius:20px;padding:9px 12px;white-space:nowrap;font-size:13px}
.snd{padding:9px 10px}

main{max-width:520px;margin:0 auto;padding:16px;perspective:1200px}
main.rev>*{animation:rv .7s cubic-bezier(.2,.9,.25,1) both}
main.rev>*:nth-child(2){animation-delay:.06s}main.rev>*:nth-child(3){animation-delay:.12s}main.rev>*:nth-child(4){animation-delay:.18s}main.rev>*:nth-child(5){animation-delay:.24s}main.rev>*:nth-child(n+6){animation-delay:.3s}
@keyframes rv{from{opacity:0;transform:translateY(40px) rotateX(-28deg)}}

.card{position:relative;background:linear-gradient(160deg,rgba(255,255,255,.075),rgba(255,255,255,.02));border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 16px 30px -14px rgba(0,0,0,.8)}
.tilt{transform:perspective(900px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transform-style:preserve-3d;transition:transform .35s cubic-bezier(.2,.9,.3,1)}
.tilt.act{transition:transform .08s linear}
.tilt:after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:radial-gradient(circle at var(--mx,50%) var(--my,0%),rgba(255,240,200,.16),transparent 55%);opacity:0;transition:opacity .3s}
.tilt.act:after{opacity:1}
.flash{animation:fla 1.4s ease}
@keyframes fla{0%{box-shadow:0 0 0 2px var(--gold2),0 0 40px rgba(231,207,138,.8)}100%{box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 16px 30px -14px rgba(0,0,0,.8)}}

.hero{text-align:center;padding:4px 14px 18px;overflow:hidden;background:radial-gradient(80% 60% at 50% 35%,rgba(231,207,138,.16),transparent 70%),linear-gradient(160deg,rgba(29,96,71,.55),rgba(4,17,11,.6));border-color:rgba(231,207,138,.45)}
#stage{position:relative;height:330px;margin:0 -14px;cursor:pointer;touch-action:pan-y}
#stage canvas{display:block;width:100%;height:100%}
#stage.fb{display:grid;place-items:center}
.big{font:900 76px/1 var(--fd);margin-top:-6px;background:linear-gradient(180deg,#fffbe6 0,#f3dc97 35%,#c9a24b 60%,#8a6a25 75%,#f5e2a8 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 1px 0 #8a6a25) drop-shadow(0 2px 0 #6e521a) drop-shadow(0 3px 0 #523c12) drop-shadow(0 4px 0 #3a2a0a) drop-shadow(0 14px 18px rgba(0,0,0,.7))}
.big small{font-size:38px}
.sub{font:500 13px var(--fn);letter-spacing:.32em;color:var(--gold2);margin-top:8px;text-transform:uppercase}
.btn.st{margin-top:16px}

.coin3d{position:relative;width:170px;height:170px;transform-style:preserve-3d;animation:cs 6s linear infinite}
.coin3d img{position:absolute;inset:0;width:100%;height:100%;border-radius:50%;box-shadow:0 0 0 4px var(--gold),0 0 40px rgba(231,207,138,.5);backface-visibility:hidden}
.coin3d img.bk{transform:rotateY(180deg)}
.coin3d.sm{width:90px;height:90px;margin:0 auto}
@keyframes cs{to{transform:rotateY(360deg)}}
.fbw{position:relative;display:grid;place-items:center;width:300px;height:300px;perspective:800px}
.fbw svg{position:absolute;inset:0;width:100%;height:100%;transform:rotateX(18deg)}

.bar{position:relative;height:20px;background:rgba(0,0,0,.4);border-radius:12px;overflow:hidden;margin:12px 0 6px;box-shadow:inset 0 2px 5px rgba(0,0,0,.7),0 1px 0 rgba(255,255,255,.06)}
.bar i{position:relative;display:block;height:100%;border-radius:12px;background:linear-gradient(90deg,var(--c1),var(--c2));box-shadow:0 0 16px var(--c2),inset 0 1px 0 rgba(255,255,255,.45),inset 0 -4px 6px rgba(0,0,0,.25);transition:width 1.5s cubic-bezier(.2,.9,.2,1);overflow:hidden}
.bar i:after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.55) 50%,transparent 70%);transform:translateX(-100%);animation:sh 2.8s ease-in-out infinite}
@keyframes sh{60%,100%{transform:translateX(100%)}}
.bar i.w{background:linear-gradient(90deg,#a9822f,#fff4cf,#e7cf8a,#c9a24b,#fff4cf,#a9822f);background-size:200% 100%;animation:foil 3s linear infinite;box-shadow:0 0 22px rgba(231,207,138,.9),inset 0 1px 0 #fff}
@keyframes foil{to{background-position:200% 0}}
.bar em{position:absolute;right:9px;top:0;line-height:20px;font:700 12px var(--fn);font-style:normal;color:#fff;text-shadow:0 1px 3px #000,0 0 6px #000}
.strip{display:flex;height:5px;border-radius:3px;overflow:hidden;background:rgba(255,255,255,.06);margin-bottom:8px}
.strip b{height:100%;transition:width 1s}

.row{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--mut)}
.k{color:var(--ink);align-items:center}
h3{font:700 14px var(--fd);letter-spacing:.08em;margin-bottom:4px;color:var(--gold3)}
.chd{display:flex;align-items:center;gap:12px;transform-style:preserve-3d}
.chd h3{flex:1;margin:0;font-size:15px}
.ico{flex:none;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-size:23px;background:radial-gradient(circle at 35% 30%,#2e7a5a,#0b2a1f 70%);box-shadow:0 0 0 2px var(--gold),0 0 0 5px rgba(201,162,75,.18),0 8px 14px rgba(0,0,0,.55),inset 0 2px 3px rgba(255,255,255,.3);transform:translateZ(36px)}
.ch .win{transform:translateZ(24px)}
.won{border-color:var(--gold2);background:linear-gradient(160deg,rgba(231,207,138,.2),rgba(255,255,255,.03))}
.won:before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.12) 45%,rgba(120,255,220,.08) 50%,rgba(255,180,240,.08) 55%,transparent 65%);background-size:250% 100%;animation:holo 4s linear infinite}
@keyframes holo{from{background-position:150% 0}to{background-position:-100% 0}}
.won .ico{background:radial-gradient(circle at 35% 30%,#fff4cf,#c9a24b 55%,#6e521a)}
.hot{border-color:#ff9f43;animation:hot 1.6s ease-in-out infinite}
@keyframes hot{50%{box-shadow:0 0 0 1px #ff9f43,0 0 30px -4px rgba(255,140,40,.8)}}
.hotl{margin-top:10px;font:600 13px var(--fn);letter-spacing:.04em;color:#ffb36b}
label{display:block;font:700 11px var(--fn);letter-spacing:.18em;text-transform:uppercase;color:var(--gold2);margin:14px 0 7px}
input,select{width:100%;padding:13px;border:1px solid var(--line);border-radius:12px;font-size:16px;background:rgba(0,0,0,.35);color:var(--ink);box-shadow:inset 0 2px 6px rgba(0,0,0,.5)}
input:focus,select:focus{outline:none;border-color:var(--gold2);box-shadow:0 0 0 3px rgba(231,207,138,.2),inset 0 2px 6px rgba(0,0,0,.5)}
select option{background:#0b2a1f;color:var(--ink)}
input[type=file]{font-size:13px}
button{font:inherit;cursor:pointer}
.btn{width:100%;margin-top:16px;padding:15px;border:0;border-radius:14px;background:linear-gradient(180deg,#f3dc97,#c9a24b 55%,#a9822f);color:#1a1405;font:700 15px var(--fn);letter-spacing:.12em;text-transform:uppercase;box-shadow:0 5px 0 #6e521a,0 12px 22px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.7);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #6e521a,0 4px 10px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.7)}
.btn.r{background:linear-gradient(180deg,#ff8a7a,#c1443c 60%,#8f2a24);color:#fff;box-shadow:0 5px 0 #5c1712,0 12px 22px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.4)}
.btn.g{background:linear-gradient(180deg,rgba(255,255,255,.12),rgba(255,255,255,.04));color:var(--gold2);border:1px solid var(--line);box-shadow:0 4px 0 rgba(0,0,0,.45),0 10px 18px rgba(0,0,0,.35)}
.chips{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.chip{padding:10px 4px;border:1px solid var(--line);border-radius:14px;background:rgba(0,0,0,.28);color:var(--ink);font-weight:700;font-size:13px;transition:transform .2s,box-shadow .2s,border-color .2s}
.chip:before{content:"";display:block;width:28px;height:28px;margin:0 auto 6px;border-radius:50%;background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.75),var(--pc) 42%,rgba(0,0,0,.6) 100%);box-shadow:0 4px 8px rgba(0,0,0,.5)}
.chip.on{border-color:var(--pc);color:#fff;background:rgba(255,255,255,.08);box-shadow:0 0 18px -3px var(--pc),inset 0 0 12px -6px var(--pc);transform:translateY(-3px)}
.chip.on:before{animation:bob 1.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-3px) scale(1.08)}}
.win{background:linear-gradient(180deg,#fff4cf,#c9a24b);color:#1a1405;font:700 11px var(--fn);letter-spacing:.1em;padding:4px 9px;border-radius:20px;white-space:nowrap;box-shadow:0 3px 10px rgba(201,162,75,.5)}
.win.hotb{background:linear-gradient(180deg,#ffcf8a,#ff7a2f);box-shadow:0 3px 12px rgba(255,122,47,.6)}
.x{border:1px solid rgba(255,107,91,.35);background:rgba(255,107,91,.12);color:#ffb3a8;border-radius:10px;padding:8px 11px}
.x.e{border-color:var(--line);background:rgba(201,162,75,.1);color:var(--gold2)}

.av{display:inline-grid;place-items:center;flex:none;width:30px;height:30px;border-radius:50%;background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.7),var(--pc) 42%,rgba(0,0,0,.55) 100%);color:#0b0b0b;font:700 13px var(--fn);text-shadow:0 1px 0 rgba(255,255,255,.4);box-shadow:0 3px 8px rgba(0,0,0,.5)}
.fi{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid rgba(255,255,255,.06);font-size:14px}
.fi:last-child{border:0}
.fi .ft{flex:1;min-width:0}
.fi small{display:block;font-size:12px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fi time{font:500 12px var(--fn);color:var(--dim)}
.fi.gold .ft{color:var(--gold2);font-weight:600}
.fi.new{animation:fin .9s cubic-bezier(.2,1.3,.3,1)}
@keyframes fin{from{transform:perspective(500px) rotateX(-90deg);opacity:0;background:rgba(231,207,138,.3)}60%{background:rgba(231,207,138,.18)}}
.live{display:inline-block;width:8px;height:8px;border-radius:50%;background:#ff4d4d;margin-right:8px;vertical-align:1px;box-shadow:0 0 0 0 rgba(255,77,77,.7);animation:lv 1.6s infinite}
@keyframes lv{70%{box-shadow:0 0 0 8px rgba(255,77,77,0)}100%{box-shadow:0 0 0 0 rgba(255,77,77,0)}}

.clk{display:flex;justify-content:center;align-items:flex-start;gap:4px;margin:14px 0 6px;color:var(--ink)}
.fg{display:flex;gap:4px;position:relative;padding-bottom:18px}
.fg small{position:absolute;bottom:0;left:0;right:0;text-align:center;font:500 10px var(--fn);letter-spacing:.25em;text-transform:uppercase;color:var(--dim)}
.fd{position:relative;width:38px;height:58px;border-radius:9px;perspective:220px;background:linear-gradient(180deg,#1f553f 0,#143d2d 49.5%,#0c2a1f 50.5%,#0f3326 100%);box-shadow:0 6px 0 #04110b,0 10px 18px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.15);font:700 40px/58px var(--fn);text-align:center}
.fd:after{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:rgba(0,0,0,.6)}
.fd b{display:block;transform-origin:50% 50%}
.fd.fl b{animation:flp .5s cubic-bezier(.3,1.5,.5,1)}
@keyframes flp{from{transform:rotateX(-100deg);opacity:.2}}
.fc{font:700 34px/58px var(--fn);color:var(--gold)}
.clk.warn .fd{color:var(--gold2)}
.clk.crit .fd{color:#ff8a7a;box-shadow:0 6px 0 #2a0805,0 0 24px rgba(255,80,60,.55),inset 0 1px 0 rgba(255,255,255,.15)}
.clk.pulse{animation:pu 1s infinite}
@keyframes pu{50%{opacity:.55}}
.crit{color:#ff8a7a}
.tbar{height:6px;border-radius:4px;background:rgba(0,0,0,.4);overflow:hidden;margin-top:4px}
.tbar i{display:block;height:100%;background:linear-gradient(90deg,#c1443c,#e7cf8a);box-shadow:0 0 10px rgba(231,207,138,.7);transition:width 1s linear}
.vg{position:fixed;inset:0;pointer-events:none;z-index:40;opacity:0;box-shadow:inset 0 0 140px 30px rgba(255,30,20,.65);transition:opacity .6s}
body.vig .vg{opacity:1;animation:vgp 1s ease-in-out infinite}
@keyframes vgp{50%{box-shadow:inset 0 0 80px 10px rgba(255,30,20,.35)}}

nav{position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));max-width:520px;margin:0 auto;display:flex;align-items:flex-end;padding:6px 4px;border-radius:24px;background:rgba(6,22,15,.86);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border:1px solid var(--line);box-shadow:0 18px 40px rgba(0,0,0,.65);z-index:30}
nav button{flex:1;border:0;background:none;color:var(--dim);font:600 10px var(--fn);letter-spacing:.08em;text-transform:uppercase;padding:6px 2px}
nav button span{display:block;font-size:21px;margin-bottom:2px;transition:transform .3s cubic-bezier(.2,1.5,.4,1),filter .3s}
nav button.on{color:var(--gold2)}
nav button.on span{transform:translateY(-3px) scale(1.18);filter:drop-shadow(0 0 8px rgba(231,207,138,.8))}
nav button[data-t=add] span{width:56px;height:56px;margin:-30px auto 3px;border-radius:50%;display:grid;place-items:center;font:700 30px var(--fn);color:#1a1405;background:radial-gradient(circle at 35% 28%,#fff8dc,#e7cf8a 30%,#c9a24b 60%,#7a5a1c);box-shadow:0 6px 0 #5c4413,0 14px 24px rgba(0,0,0,.65),inset 0 2px 2px rgba(255,255,255,.7),0 0 0 4px rgba(4,17,11,.9)}
nav button[data-t=add].on span{transform:translateY(-4px) rotate(90deg)}

.pod{display:flex;align-items:flex-end;justify-content:center;gap:8px;margin:20px 0 6px;perspective:700px}
.pl{flex:1;max-width:120px;text-align:center;transform-style:preserve-3d;animation:sway 6s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotateX(14deg) rotateY(-12deg)}50%{transform:rotateX(14deg) rotateY(12deg)}}
.pav{display:flex;flex-direction:column;align-items:center;gap:3px;margin-bottom:10px;transform:translateZ(20px)}
.pav .av{width:52px;height:52px;font-size:22px;animation:fly 2.4s ease-in-out infinite}
.p1 .pav .av{width:64px;height:64px;font-size:26px;box-shadow:0 0 0 3px var(--gold2),0 0 30px rgba(231,207,138,.7)}
@keyframes fly{50%{transform:translateY(-6px)}}
.crown{font-style:normal;font-size:28px;margin-bottom:-14px;z-index:1;animation:fly 2.4s ease-in-out infinite;filter:drop-shadow(0 4px 6px rgba(0,0,0,.5))}
.pav b{font-size:14px}.pav small{font:500 11px var(--fn);color:var(--gold2);letter-spacing:.06em}
.blk{position:relative;height:var(--h);transform-style:preserve-3d;background:linear-gradient(180deg,var(--t1),var(--t2));border-radius:4px 4px 0 0;box-shadow:inset 0 2px 0 rgba(255,255,255,.5),inset 0 -20px 30px rgba(0,0,0,.25);display:grid;place-items:start center;padding-top:10px;font:900 30px var(--fd);color:rgba(0,0,0,.55);text-shadow:0 1px 0 rgba(255,255,255,.4)}
.blk:before{content:"";position:absolute;left:0;right:0;top:0;height:34px;transform-origin:50% 0;transform:rotateX(-90deg);background:linear-gradient(180deg,var(--t1),var(--t3));filter:brightness(1.25)}
.blk:after{content:"";position:absolute;top:0;bottom:0;right:0;width:34px;transform-origin:100% 50%;transform:rotateY(-90deg);background:linear-gradient(180deg,var(--t2),#000);opacity:.85}
.p1 .blk{--h:120px;--t1:#fff1b8;--t2:#c9a24b;--t3:#8a6a25}
.p2 .blk{--h:88px;--t1:#f2f4f5;--t2:#9aa4a8;--t3:#5d676b}
.p3 .blk{--h:64px;--t1:#f3c49b;--t2:#b26e3c;--t3:#6e3f1e}
.podn{text-align:center;font-size:11px;color:var(--dim);margin-top:10px}
.rk{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid rgba(255,255,255,.06)}
.rk i{font:700 14px var(--fn);font-style:normal;color:var(--dim);width:18px}
.rk>span:not(.av){flex:1;text-align:left}
.achs{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:12px}
.ach{position:relative;padding:12px 10px;border-radius:14px;border:1px solid var(--line);background:rgba(0,0,0,.25);text-align:center;font-size:12px}
.ach .ai{display:grid;place-items:center;width:48px;height:48px;margin:0 auto 8px;border-radius:50%;font-size:24px;background:radial-gradient(circle at 35% 30%,#fff4cf,#c9a24b 55%,#6e521a);box-shadow:0 5px 0 #4a3510,0 10px 16px rgba(0,0,0,.5),inset 0 2px 2px rgba(255,255,255,.6);animation:wob 4s ease-in-out infinite}
@keyframes wob{0%,100%{transform:perspective(200px) rotateY(-28deg)}50%{transform:perspective(200px) rotateY(28deg)}}
.ach b{display:block;font-size:13px;color:var(--gold3);margin-bottom:2px}
.ach small{color:var(--mut)}
.ach.lk{opacity:.45;filter:grayscale(1)}
.ach.lk .ai{animation:none}
.pc{border-left:4px solid var(--pc)}
.pc h3{display:flex;align-items:center;gap:10px}

.pop{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle,rgba(4,17,11,.55),rgba(4,17,11,.94));z-index:50;perspective:1000px;overflow:hidden}
.rays{position:absolute;left:50%;top:50%;width:170vmax;height:170vmax;margin:-85vmax 0 0 -85vmax;background:repeating-conic-gradient(rgba(231,207,138,.17) 0 7deg,transparent 7deg 18deg);-webkit-mask:radial-gradient(circle,#000 0,transparent 55%);mask:radial-gradient(circle,#000 0,transparent 55%);animation:spin 22s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.popc{position:relative;width:250px;padding:26px 18px 30px;border-radius:22px;text-align:center;background:radial-gradient(circle at 50% 0,#1f6a4d,#0b2a1f 70%);border:2px solid var(--gold2);box-shadow:0 0 0 7px rgba(201,162,75,.15),0 30px 70px rgba(0,0,0,.8),0 0 90px rgba(231,207,138,.4);animation:cin 1.1s cubic-bezier(.2,1.35,.3,1) both;transform-style:preserve-3d}
@keyframes cin{from{transform:rotateY(-540deg) rotateX(35deg) scale(.15);opacity:0}}
.cs{position:absolute;font-style:normal;font-size:22px;color:var(--gold2)}
.cs.tl{left:14px;top:10px}.cs.br{right:14px;bottom:10px;transform:rotate(180deg)}
.plogo{width:96px;height:96px;border-radius:50%;box-shadow:0 0 0 3px var(--gold),0 10px 24px rgba(0,0,0,.6);transform:translateZ(40px)}
.pk{font:500 12px var(--fn);letter-spacing:.35em;color:var(--gold2);margin-top:14px}
.pem{font-size:46px;margin-top:6px;transform:translateZ(60px);animation:fly 1.6s ease-in-out infinite}
.pt{font:900 22px/1.2 var(--fd);margin-top:6px;color:var(--gold3);transform:translateZ(30px)}
.cf{position:fixed;inset:0;pointer-events:none;z-index:60;overflow:hidden;perspective:900px}
.cf i{position:absolute;left:0;top:0;font-style:normal;will-change:transform}
.cf .coin{width:20px;height:20px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff8dc,#e7cf8a 35%,#c9a24b 65%,#7a5a1c);box-shadow:inset 0 0 0 2px rgba(122,90,28,.7)}
.cf .rect{width:9px;height:15px;border-radius:2px}
.cf .suit,.cf .em{font-size:24px;text-shadow:0 2px 4px rgba(0,0,0,.4)}

.story .sbox{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;padding:16px;width:min(92vw,420px);animation:cin .9s cubic-bezier(.2,1.2,.3,1) both}
.story img{max-height:66vh;max-width:100%;border-radius:16px;box-shadow:0 0 0 2px var(--gold),0 30px 70px rgba(0,0,0,.8)}
.story .srow{display:flex;gap:10px;width:100%}
.story .srow .btn{margin-top:10px}
.story .cl{position:absolute;right:6px;top:-6px;z-index:2}
.load{text-align:center;margin-top:70px;color:var(--mut);font:500 13px var(--fn);letter-spacing:.3em}
.load p{margin-top:24px}
@media(prefers-reduced-motion:reduce){*{animation:none!important}.cf{display:none}}

function tick(){

  $("#lbl").textContent=r?"Zeit verbleibend":"Beendet – neue Einträge = Nachtrag";
  const b=$("#tbar"); if(b) b.style.width=(S.tm.startedAt&&S.tm.endsAt>S.tm.startedAt?Math.min(100,r/(S.tm.endsAt-S.tm.startedAt)*100):0)+"%";
}

function touch(){ return db.ref("wc/meta/lastSave").set(firebase.database.ServerValue.TIMESTAMP); }
function showLs(v){ $("#ls").textContent="Zuletzt gespeichert: "+(v?new Date(v).toLocaleString("de-DE"):"—"); }

  touch().then(()=>{ b.textContent="✓ Gespeichert"; }).catch(()=>{ b.textContent="Fehler"; });
  setTimeout(()=>{ b.textContent="💾 Speichern"; },2000);

function dl(name,text,type){ const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([text],{type})); a.download=name; document.body.appendChild(a); a.click(); a.remove(); }
const stamp=()=>new Date().toISOString().slice(0,16).replace(/[:T]/g,"-");
function expJson(){ dl("win-challenge-"+stamp()+".json",JSON.stringify({version:1,exportedAt:Date.now(),challenges:S.ch,entries:S.en,timer:S.tm},null,1),"application/json"); }
function expCsv(){
  const q=v=>'"'+String(v??"").replace(/"/g,'""')+'"';
  const rows=[["Challenge","Person","Menge","Einheit","Zeit","Nachtrag","Notiz"].map(q).join(";")];
  Object.values(S.en).sort((a,b)=>a.ts-b.ts).forEach(e=>{ const c=S.ch[e.challengeId]||{};
    rows.push([c.name,e.person,String(e.amount).replace(".",","),c.unit,new Date(e.ts).toLocaleString("de-DE"),e.late?"Ja":"Nein",e.note].map(q).join(";")); });
  dl("win-challenge-"+stamp()+".csv","\uFEFF"+rows.join("\r\n"),"text/csv;charset=utf-8");
}
function impJson(inp){
  const f=inp.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{
    let d; try{ d=JSON.parse(r.result); }catch(e){ alert("Datei ist kein gültiges JSON"); return; }
    if(!validImp(d)){ alert("Datei ungültig oder keine Win-Challenge-Sicherung"); return; }
    if(!confirm("Import ersetzt ALLE aktuellen Daten für alle Geräte. Weiter?")){ inp.value=""; return; }
    expJson();
    db.ref("wc").update({challenges:d.challenges,entries:d.entries||null,timer:d.timer||null})
      .then(()=>{ touch(); alert("Import fertig"); }).catch(()=>alert("Import fehlgeschlagen"));
    inp.value="";
  };
  r.readAsText(f);
}

// ====== ERWEITERUNGEN ======
function validImp(d){ return d&&d.challenges&&typeof d.challenges==="object"&&Object.values(d.challenges).every(c=>c&&c.name&&c.target>0&&c.unit)&&(!d.entries||Object.values(d.entries).every(e=>e&&e.challengeId in d.challenges&&PERSONS.includes(e.person)&&e.amount>0)); }
function edE(k){
  const e=S.en[k]; if(!e) return;
  const v=prompt("Neue Menge:",String(e.amount).replace(".",",")); if(v===null) return;
  const a=parseFloat(v.replace(",","."));
  if(!(a>0)||!isFinite(a)){ alert("Ungültige Menge"); return; }
  const n=prompt("Notiz:",e.note||""); if(n===null) return;
  db.ref("wc/entries/"+k).update({amount:a,note:n.trim(),edited:Date.now()}).then(touch).catch(()=>alert("Änderung fehlgeschlagen"));

function feed(){
  const l=Object.entries(S.en).sort((a,b)=>b[1].ts-a[1].ts).slice(0,5).map(([k,e])=>{ const c=S.ch[e.challengeId]; return c?`<div class="fi" data-k="${k}">${av(e.person)}<span class="ft"><b>${esc(e.person)}</b> +${fmt(e.amount)} ${esc(c.unit)}<small>${ico(e.challengeId,c)} ${esc(c.name)}</small></span><time>${new Date(e.ts).toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"})}</time></div>`:""; }).join("");
  const w=Object.keys(S.ach).filter(k=>k.startsWith("win_")&&S.ch[k.slice(4)]).map(k=>`<div class="fi gold"><span class="av" style="--pc:#e7cf8a">🏆</span><span class="ft">Team hat „${esc(S.ch[k.slice(4)].name)}“ geschafft</span></div>`).join("");
  return `<div class="card"><h3><i class="live"></i>Live-Aktivität</h3>${w}${l||'<div class="row">Noch keine Einträge.</div>'}</div>`;
}
const avg=()=>{ const i=Object.keys(S.ch); return i.length?i.reduce((s,id)=>s+stats(id).pct,0)/i.length:0; };
const ACH=[
  {id:"first",i:"🌱",t:"Erster Eintrag",d:"Der erste Beitrag ist drin",f:()=>Object.keys(S.en).length>=1},
  {id:"win1",i:"🏆",t:"Erste Challenge geschafft",d:"Ein gemeinsames Ziel ist erreicht",f:()=>Object.keys(S.ch).some(id=>stats(id).win)},
  ...[25,50,75].map(n=>({id:"p"+n,i:"🌿",t:n+" % Team",d:"Im Schnitt "+n+" % aller Ziele",f:()=>avg()>=n})),
  {id:"all7",i:"🤝",t:"Alle dabei",d:"Alle 7 haben mindestens einmal beigetragen",f:()=>PERSONS.filter(p=>p!=="Gruppe").every(p=>Object.values(S.en).some(e=>e.person===p))},
  {id:"e50",i:"📈",t:"50 Einträge",d:"Gemeinsam 50 Einträge",f:()=>Object.keys(S.en).length>=50},
  {id:"p100",i:"👑",t:"Alles geschafft",d:"Alle Challenges abgeschlossen",f:()=>{ const i=Object.keys(S.ch); return i.length>0&&i.every(id=>stats(id).win); }}
];
function checkAch(){
  if(!S.achReady||!S.enOk||!S.ok||!db) return;
  [...ACH.filter(a=>a.f()).map(a=>a.id),...Object.keys(S.ch).filter(id=>stats(id).win).map(id=>"win_"+id)].forEach(id=>{

function popup(k){
  const w=k.startsWith("win_"), a=ACH.find(x=>x.id===k);
  const t=w?"WIN! "+((S.ch[k.slice(4)]||{}).name||""):a?a.i+" "+a.t:null; if(!t) return;
  const em=w?ico(k.slice(4),S.ch[k.slice(4)]):a.i;

  d.innerHTML=`<div class="rays"></div><div class="popc"><i class="cs tl">♠</i><i class="cs br">♠</i><img class="plogo" src="${LOGO}" alt=""><div class="pk">${w?"TEAM-ERFOLG":"ACHIEVEMENT"}</div><div class="pem">${em}</div><div class="pt">${esc(t)}</div></div>`;
  d.onclick=()=>d.remove(); document.body.appendChild(d); confetti(w?em:null); sfx(w?"win":"ach"); buzz(w?[60,40,60,40,180]:[40,30,80]); setTimeout(()=>d.remove(),4200);
}
function confetti(em){
  const W=innerWidth,H=innerHeight; burst(W/2,H*.5,em?120:60,em);
}
function burst(x0,y0,n,em,small){
  const c=document.createElement("div"); c.className="cf";
  const kinds=["coin","coin","rect","suit"]; if(em) kinds.push("em","em");
  for(let i=0;i<n;i++){ const p=document.createElement("i"), k=small?"coin":kinds[i%kinds.length]; p.className=k;
    if(k==="suit"){ const s="♠♥♦♣"[i%4]; p.textContent=s; p.style.color=s==="♥"||s==="♦"?"#ff5c4d":"#e7cf8a"; }
    if(k==="em") p.textContent=em;
    if(k==="rect") p.style.background=["#e7cf8a","#2fa874","#fff4cf","#c9a24b"][i%4];
    c.appendChild(p);
    const ang=-Math.PI/2+(Math.random()-.5)*(small?1.6:2.4), v=(small?160:innerHeight*.45)*(.5+Math.random()*.7), dx=Math.cos(ang)*v, dy=Math.sin(ang)*v;
    const rx=Math.random()*1440-720, ry=Math.random()*1440-720, rz=Math.random()*720-360, z=Math.random()*300-100;
    p.animate([
      {transform:`translate3d(${x0}px,${y0}px,0) scale(.3)`},
      {transform:`translate3d(${x0+dx}px,${y0+dy}px,${z}px) rotateX(${rx/3}deg) rotateY(${ry/3}deg) rotateZ(${rz/3}deg) scale(1)`,offset:.3},
      {transform:`translate3d(${x0+dx*1.4}px,${innerHeight+80}px,${z}px) rotateX(${rx}deg) rotateY(${ry}deg) rotateZ(${rz}deg) scale(1)`}
    ],{duration:(small?1400:2800)+Math.random()*1400,easing:"cubic-bezier(.15,.7,.45,1)",delay:Math.random()*200,fill:"forwards"});
  }
  document.body.appendChild(c); setTimeout(()=>c.remove(),small?3000:4800);
}
const pts=p=>Object.keys(S.ch).reduce((s,id)=>s+(stats(id).by[p]||0)/S.ch[id].target*100,0);
function rank(){ return PERSONS.filter(p=>p!=="Gruppe").map(p=>({p,v:pts(p),n:Object.values(S.en).filter(e=>e.person===p).length})).sort((a,b)=>b.v-a.v||b.n-a.n); }

  const ach=ACH.map(a=>`<div class="ach${S.ach[a.id]?"":" lk"}"><div class="ai">${S.ach[a.id]?a.i:"🔒"}</div><b>${a.t}</b><small>${a.d}</small></div>`).join("");
  const pod=[1,0,2].map(i=>{ const r=rk[i]; if(!r) return ""; return `<div class="pl p${i+1}" style="--pc:${PC[r.p]}"><div class="pav">${i===0?'<i class="crown">👑</i>':""}${av(r.p)}<b>${r.p}</b><small>${cu("pt"+r.p,r.v)} Pkt</small></div><div class="blk">${i+1}</div></div>`; }).join("");
  const rest=rk.slice(3).map((r,i)=>`<div class="rk"><i>${i+4}</i>${av(r.p)}<span>${r.p}</span><small style="color:var(--gold2)">${fmt(r.v)} Pkt</small></div>`).join("");
  const pr=PERSONS.filter(p=>p!=="Gruppe").map(p=>{
    const mine=en.filter(e=>e.person===p);
    const by=Object.keys(S.ch).map(id=>{ const t=mine.filter(e=>e.challengeId===id).reduce((s,e)=>s+e.amount,0); return t?`<div class="row" style="margin-top:6px"><span>${ico(id,S.ch[id])} ${esc(S.ch[id].name)}</span><b style="color:var(--ink)">${fmt(t)} ${esc(S.ch[id].unit)}</b></div>`:""; }).join("");
    return `<div class="card pc tilt" style="--pc:${PC[p]}"><h3>${av(p)}${p}</h3><div class="row"><span>${mine.length} Einträge</span></div>${by}</div>`;
  }).join("");
  $("#main").innerHTML=`<div class="card hero" style="padding-top:16px"><h3>🏆 Podium</h3><div class="pod">${pod}</div>${rest}<div class="podn">Punkte = Summe der %-Beiträge zu allen Challenges</div></div><div class="card"><h3>Team-Erfolge</h3><div class="row"><span>${cu("en",en.length,1)} Einträge insgesamt</span></div><div class="achs">${ach}</div></div>${pr}`;
}

    g.save(); g.shadowColor="rgba(0,0,0,.7)"; g.shadowBlur=40; g.shadowOffsetY=depth+10; g.fillStyle="#3a2a0a"; g.fillText(t,x,y+depth); g.restore();
    for(let d=depth;d>0;d--){ g.fillStyle=`hsl(40,${55-d}%,${12+(depth-d)*18/depth}%)`; g.fillText(t,x,y+d); }
    g.fillStyle=gg(y-size*.8,y); g.fillText(t,x,y); g.lineWidth=1.5; g.strokeStyle="rgba(255,250,220,.6)"; g.strokeText(t,x,y); };
  g.fillStyle="#e7cf8a"; g.font=`500 30px ${FN}`; g.textBaseline="middle"; spaced("SV MONTE CARLO · EST. 2024",540,120,9);
  goldText("WIN",540,255,124,12); goldText("CHALLENGE",540,355,88,9);
  // 3D-Herzstück
  gr=g.createRadialGradient(540,750,0,540,750,420); gr.addColorStop(0,"rgba(255,230,160,.45)"); gr.addColorStop(1,"rgba(255,230,160,0)"); g.fillStyle=gr; g.fillRect(0,330,W,840);
  const snap=h3snap(1000);
  if(snap){ const m=snap.getContext("2d"); m.globalCompositeOperation="destination-in"; const mg=m.createRadialGradient(500,500,330,500,500,500); mg.addColorStop(0,"#000"); mg.addColorStop(1,"rgba(0,0,0,0)"); m.fillStyle=mg; m.fillRect(0,0,1000,1000); g.drawImage(snap,130,340,820,820); }
  else { const n=ids.length||1, seg=Math.PI*2/n; g.lineCap="round"; sts.forEach((s,i)=>{ const a0=-Math.PI/2+i*seg+.04, a1=a0+seg-.08; g.lineWidth=26; g.strokeStyle="rgba(255,255,255,.1)"; g.beginPath(); g.arc(540,780,330,a0,a1); g.stroke(); g.lineWidth=s.win?36:26; g.strokeStyle=s.win?"#fff1b8":"#d9b25a"; g.beginPath(); g.arc(540,780,330,a0,a0+(a1-a0)*s.pct/100); g.stroke(); });
    g.save(); g.shadowColor="rgba(0,0,0,.7)"; g.shadowBlur=50; g.shadowOffsetY=20; g.fillStyle="#7a5a1c"; g.beginPath(); g.arc(540,795,215,0,Math.PI*2); g.fill(); g.restore();
    g.save(); g.beginPath(); g.arc(540,780,210,0,Math.PI*2); g.clip(); if(logo.complete) g.drawImage(logo,330,570,420,420); g.restore(); g.lineWidth=10; g.strokeStyle=gg(570,990); g.beginPath(); g.arc(540,780,212,0,Math.PI*2); g.stroke(); }
  goldText(fmt(Math.round(tot*10)/10)+"%",540,1270,180,15);
  g.fillStyle="#e7cf8a"; g.font=`500 30px ${FN}`; g.textBaseline="middle"; spaced("GESAMTFORTSCHRITT",540,1322,12);
  // Kacheln
  const r=S.tm&&S.tm.endsAt?Math.max(0,S.tm.endsAt-Date.now()):null, p2=n=>String(n).padStart(2,"0");
  const tiles=[[wins+" / "+ids.length,"GESCHAFFT"],[String(Object.keys(S.en).length),"EINTRÄGE"],[r===null?"—":r?`${p2(r/36e5|0)}:${p2(r%36e5/6e4|0)}`:"ENDE",r?"STD VERBLEIBEND":"TIMER"]];
  tiles.forEach(([v,l],i)=>{ const x=96+i*302, y=1360; g.fillStyle="rgba(255,255,255,.07)"; rr(x,y,284,116,24); g.fill(); g.lineWidth=2; g.strokeStyle="rgba(231,207,138,.45)"; g.stroke();
    g.textAlign="center"; g.fillStyle="#fff4cf"; g.font=`700 52px ${FN}`; g.textBaseline="alphabetic"; g.fillText(v,x+142,y+66); g.fillStyle="#9fb5a9"; g.font=`500 20px ${FN}`; spaced(l,x+142,y+96,4); });
  // Challenges
  const rows=Math.ceil(ids.length/2), rh=Math.min(46,270/Math.max(1,rows)), cw=430;
  ids.forEach((id,i)=>{ const s=sts[i], c=S.ch[id], x=100+(i%2)*(cw+50), y=1530+Math.floor(i/2)*rh;
    g.textAlign="left"; g.textBaseline="middle"; g.font=`${rh*.52}px system-ui, sans-serif`; g.fillStyle="#fff"; g.fillText(ico(id,c),x,y);
    g.font=`500 ${rh*.44}px ${FN}`; g.fillStyle=s.win?"#fff1b8":"#f4f1e6"; let nm=c.name; while(g.measureText(nm).width>250&&nm.length>3) nm=nm.slice(0,-2)+"…"; g.fillText(nm,x+rh*.75,y-rh*.12);
    g.textAlign="right"; g.fillStyle=s.win?"#fff1b8":"#e7cf8a"; g.fillText(s.win?"✓ WIN":Math.floor(s.pct)+"%",x+cw,y-rh*.12);
    g.fillStyle="rgba(255,255,255,.1)"; rr(x+rh*.75,y+rh*.24,cw-rh*.75,6,3); g.fill();
    const bw=(cw-rh*.75)*s.pct/100; if(bw>1){ const l=g.createLinearGradient(x,0,x+cw,0); l.addColorStop(0,"#8a6a25"); l.addColorStop(1,s.win?"#fff4cf":"#e7cf8a"); g.fillStyle=l; rr(x+rh*.75,y+rh*.24,bw,6,3); g.fill(); } });
  // Top 3
  const rk=rank().filter(x=>x.v>0).slice(0,3);
  if(rk.length){ g.font=`600 34px ${FN}`; const parts=rk.map((x,i)=>["🥇","🥈","🥉"][i]+" "+x.p), w=parts.reduce((s,t)=>s+g.measureText(t).width+60,-60); let x=540-w/2; g.textAlign="left"; g.textBaseline="middle";
    parts.forEach((t,i)=>{ g.fillStyle=PC[rk[i].p]; g.fillText(t,x,1818); x+=g.measureText(t).width+60; }); }
  g.textAlign="center"; g.fillStyle="#6f8a7d"; g.font=`500 24px ${FN}`; g.fillText("Stand: "+new Date().toLocaleString("de-DE",{day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"}),540,1862);
  c.toBlob(b=>{ if(!b) return; STORY=b; const u=URL.createObjectURL(b), d=document.createElement("div"); d.className="pop story";
    d.innerHTML=`<div class="rays"></div><div class="sbox"><button class="x cl" onclick="this.closest('.pop').remove()">✕</button><img src="${u}" alt="Story-Karte"><div class="srow"><button class="btn" onclick="shareStory()">📤 Teilen</button><button class="btn g" onclick="dlStory()">⬇ Speichern</button></div></div>`;
    d.onclick=e=>{ if(e.target===d) d.remove(); }; document.body.appendChild(d); sfx("ach"); buzz(30); },"image/png");
}
function shareStory(){ if(!STORY) return; const f=new File([STORY],"win-challenge-story.png",{type:"image/png"});
  if(navigator.canShare&&navigator.canShare({files:[f]})) navigator.share({files:[f],title:"WIN CHALLENGE"}).catch(()=>{}); else dlStory(); }
function dlStory(){ if(!STORY) return; const a=document.createElement("a"); a.href=URL.createObjectURL(STORY); a.download="win-challenge-story-"+stamp()+".png"; document.body.appendChild(a); a.click(); a.remove(); }

$("#hl").src=$("#wm").src=LOGO; $("#snd").textContent=SND?"🔊":"🔇";

if(location.protocol.startsWith("http")&&"serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});

if(!window.firebase || FIREBASE_CONFIG.apiKey.startsWith("DEIN")){
  $("#main").innerHTML='<div class="card"><h3>Firebase fehlt</h3><p style="font-size:14px;margin-top:6px">Trag oben in der Datei deine Firebase-Daten ein (FIREBASE_CONFIG).</p></div>';
} else {
  firebase.initializeApp(FIREBASE_CONFIG);
  db=firebase.database();
  db.ref("wc/challenges").transaction(cur=>cur===null?DEF:undefined).catch(()=>{});
  auth=firebase.auth(); auth.onAuthStateChanged(u=>{ S.user=u; if(u&&S.ok&&!Object.keys(S.ch).length) db.ref("wc/challenges").set(DEF).catch(()=>{}); if(S.ok&&S.tab==="chal") render(); });
  db.ref("wc/challenges").on("value",s=>{ S.ch=s.val()||{}; S.ok=true; upd(); });
  db.ref("wc/entries").on("value",s=>{ S.en=s.val()||{}; S.enOk=true; upd(); });
  db.ref("wc/timer").on("value",s=>{ S.tm=s.val(); if(S.tab==="dash") upd(); });
  db.ref(".info/connected").on("value",s=>{ S.conn=!!s.val(); $("#st").textContent=S.conn?"● online":"○ offline"; $("#st").style.color=S.conn?"#69f0ae":"#ff6b5b"; });
  db.ref("wc/meta/lastSave").on("value",s=>showLs(s.val()));
  db.ref("wc/achievements").on("value",s=>{ const n=s.val()||{}; if(S.achReady) Object.keys(n).filter(k=>!S.ach[k]).forEach(popup); S.ach=n; S.achReady=true; upd(); });
  render();
}
